<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTIRL 실시간 위치</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0a24afa0c61af81d240efd1991f00997&libraries=services"></script>
<style>
html,body{margin:0;padding:0;background:#f5f5f5;font-family:sans-serif}
.wrap{width:340px;margin:20px auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.15)}
.info{padding:18px}
#time{font-size:18px;font-weight:700;line-height:1.1;color:#03c75a;margin-bottom:10px}
.line{height:1px;background:#e5e5e5;margin-bottom:14px}
.address{font-size:18px;font-weight:700;line-height:1.1;margin-bottom:6px}
.info-row{display:flex;justify-content:flex-start;align-items:center;margin-top:2px;font-size:16px;font-weight:700;line-height:1.1}
.value{color:#111;font-weight:800}
#map{width:100%;height:224px}
.leaflet-control-attribution,.leaflet-control-zoom{display:none}
.pulse-marker{position:relative;width:20px;height:20px}
.pulse{position:absolute;left:50%;top:50%;width:28px;height:28px;background:#2A7FFF;border-radius:50%;transform:translate(-50%,-50%);opacity:.4;animation:pulse 1.8s infinite}
.dot{position:absolute;left:50%;top:50%;width:13px;height:13px;background:#2A7FFF;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(0,0,0,.4)}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.8);opacity:.5}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
 <div class="info">
  <div id="time">시간 불러오는중...</div><div class="line"></div>
  <div class="address" id="address">위치 확인중...</div>
  <div class="info-row"><div class="value" id="distance"><span id="temp">--°C</span>&nbsp;&nbsp;0.00 km</div></div>
 </div>
 <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
//////////////////////////////////////////////////
// 현재 시간 표시
const time = document.getElementById("time");
function updateTime(){
 const now=new Date();
 const days=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
 time.innerHTML=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}<br>${now.toLocaleTimeString()}`;
}
setInterval(updateTime,1000); updateTime();

//////////////////////////////////////////////////
// Pull Key 및 Firebase 연결
const pullKey="8a7jul1r3kg4hd63";
firebase.initializeApp({
 apiKey:"AIzaSyC4L8ICZbJDufxe8bimRdB5cAulPCaYVQQ",
 databaseURL:"https://rtirl-a1d7f-default-rtdb.firebaseio.com",
 projectId:"rtirl-a1d7f",
 appId:"1:684852107701:web:d77a8ed0ee5095279a61fc"
});
const address=document.getElementById("address");
const tempText=document.getElementById("temp");
const distanceText=document.getElementById("distance");

//////////////////////////////////////////////////
// 지도 생성 및 타일
const map=L.map('map',{zoomControl:false}).setView([37.5665,126.9780],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

//////////////////////////////////////////////////
// 현재 위치 마커
const marker=L.marker([37.5665,126.9780],{
 icon:L.divIcon({
  className:'',
  html:`<div class="pulse-marker"><div class="pulse"></div><div class="dot"></div></div>`,
  iconSize:[20,20],iconAnchor:[10,10]
 })
}).addTo(map);
marker.setZIndexOffset(1000);

//////////////////////////////////////////////////
// 이동 경로: 첫 위치는 즉시, 이후 1분마다 파란 점 (연결선 없음)
const path=[];
const pathDots=L.layerGroup().addTo(map);
const DOT_INTERVAL=60*1000;
let lastDotTime=0;
function addPathDot(lat,lng){
 const now=Date.now();
 if(lastDotTime!==0 && now-lastDotTime<DOT_INTERVAL) return;
 path.push([lat,lng]);
 L.circleMarker([lat,lng],{
  radius:4,color:'#ffffff',weight:1,fillColor:'#0066FF',fillOpacity:1
 }).addTo(pathDots);
 lastDotTime=now;
 if(path.length>8000){
  path.shift();
  const layers=pathDots.getLayers();
  if(layers.length>8000) pathDots.removeLayer(layers[0]);
 }
}

//////////////////////////////////////////////////
// 자동 화면 전환: 각 단계 30초 간격
// 0=현재 위치 확대(14), 1=경로 점 전체 보기, 2=현재 위치 축소(9)
let viewMode=0;
setInterval(()=>{
 viewMode++;
 if(viewMode>2) viewMode=0;
 if(viewMode===0){
  map.flyTo(marker.getLatLng(),14,{animate:true,duration:2});
 }else if(viewMode===1){
  if(path.length>0){
   const bounds=pathDots.getBounds();
   if(bounds.isValid()) map.fitBounds(bounds,{padding:[30,30],maxZoom:14});
  }
 }else if(viewMode===2){
  map.flyTo(marker.getLatLng(),9,{animate:true,duration:2});
 }
},30000);

//////////////////////////////////////////////////
// 총 주행거리 계산
let totalDistance=0;
let prevLatLng=null;
function calculateDistance(lat1,lng1,lat2,lng2){
 const R=6371;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLng=(lng2-lng1)*Math.PI/180;
 const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

//////////////////////////////////////////////////
// 주소(카카오 API) + 실제 온도
function getKakaoAddress(geocoder,lat,lng){
 return new Promise(resolve=>{
  geocoder.coord2Address(lng,lat,(result,status)=>{
   if(status===kakao.maps.services.Status.OK && result[0]){
    const addr=result[0].address;
    resolve(`${addr.region_1depth_name||''} ${addr.region_2depth_name||''} ${addr.region_3depth_name||''}`.trim());
   }else resolve('주소 정보 없음');
  });
 });
}
async function updateAddress(lat,lng){
 try{
  const geocoder=new kakao.maps.services.Geocoder();
  address.innerHTML=await getKakaoAddress(geocoder,lat,lng);
  const weatherRes=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m`);
  const weatherData=await weatherRes.json();
  tempText.innerHTML=`${weatherData.current.temperature_2m}°C`;
 }catch(e){
  console.error("데이터 동기화 실패:",e);
  address.innerHTML='주소 확인 실패';
 }
}

//////////////////////////////////////////////////
// RTIRL 실시간 수신
console.log("Firebase 수신 대기 시작... PullKey:",pullKey);
firebase.database().ref().child("pullables").child(pullKey).on("value",async snapshot=>{
 const data=snapshot.val();
 console.log("Firebase 데이터 수신 테스트:",data);
 if(!data){console.warn("해당 PullKey로 조회된 데이터가 전혀 없습니다. Key값을 확인하세요.");return;}
 const location=data.location||data;
 if(!location||location.latitude==null||location.longitude==null){
  console.warn("위도, 경도 좌표 정보가 없습니다.",location);return;
 }
 const lat=Number(location.latitude),lng=Number(location.longitude);
 if(!Number.isFinite(lat)||!Number.isFinite(lng)){console.warn("위도/경도 값이 올바르지 않습니다.",location);return;}
 console.log(`좌표 수신 성공 -> Lat: ${lat}, Lng: ${lng}`);

 marker.setLatLng([lat,lng]);
 if(viewMode!==1) map.panTo([lat,lng],{animate:true});

 // 지도에는 1분 간격으로만 점을 추가. 점 사이를 잇는 선은 사용하지 않음.
 addPathDot(lat,lng);

 // 총 주행거리는 기존처럼 수신되는 모든 GPS 좌표를 이용해 계산
 if(prevLatLng){
  totalDistance+=calculateDistance(prevLatLng.lat,prevLatLng.lng,lat,lng);
 }
 await updateAddress(lat,lng);
 distanceText.innerHTML=`<span id="temp">${tempText.innerHTML}</span>&nbsp;&nbsp;${totalDistance.toFixed(2)} km`;
 prevLatLng={lat,lng};
},error=>console.error("Firebase 연결 에러 발생:",error));
</script>
</body>
</html>
