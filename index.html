
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTIRL 실시간 위치</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0a24afa0c61af81d240efd1991f00997&libraries=services"></script>

<style>
html,body{
    margin:0;
    padding:0;
    background:transparent;
    font-family:sans-serif;
}

.wrap{
    width:340px;
    margin:20px auto;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 6px 30px rgba(0,0,0,0.15);
    opacity:1;
    transition:opacity 0.15s;
}

/* 백그라운드에서는 완전 투명 */
body.background-mode .wrap{
    opacity:0;
    pointer-events:none;
}

.info{padding:18px;}

#time{
    font-size:18px;
    font-weight:700;
    line-height:1.1;
    color:#03c75a;
    margin-bottom:10px;
}

.line{
    height:1px;
    background:#e5e5e5;
    margin-bottom:14px;
}

.address{
    font-size:18px;
    font-weight:700;
    line-height:1.1;
    margin-bottom:6px;
}

.info-row{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    margin-top:2px;
    font-size:16px;
    font-weight:700;
    line-height:1.1;
}

.value{
    color:#111;
    font-weight:800;
}

#map{
    width:100%;
    height:224px;
}

.leaflet-control-attribution,
.leaflet-control-zoom{
    display:none;
}

.pulse-marker{
    position:relative;
    width:20px;
    height:20px;
}

.pulse{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;
    height:28px;
    background:#2A7FFF;
    border-radius:50%;
    transform:translate(-50%,-50%);
    opacity:0.4;
    animation:pulse 1.8s infinite;
}

.dot{
    position:absolute;
    left:50%;
    top:50%;
    width:13px;
    height:13px;
    background:#2A7FFF;
    border:3px solid #fff;
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 6px rgba(0,0,0,0.4);
}

@keyframes pulse{
    0%{
        transform:translate(-50%,-50%) scale(0.8);
        opacity:0.5;
    }
    100%{
        transform:translate(-50%,-50%) scale(1.8);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="wrap">
    <div class="info">
        <div id="time">시간 불러오는중...</div>
        <div class="line"></div>
        <div class="address" id="address">위치 확인중...</div>
        <div class="info-row">
            <div class="value" id="distance">
                <span id="temp">--°C</span>
                &nbsp;&nbsp;0.00 km
            </div>
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ========================================
// 1. 시간 표시

const time = document.getElementById("time");

function updateTime(){
    const now = new Date();
    const days = [
        '일요일','월요일','화요일',
        '수요일','목요일','금요일','토요일'
    ];

    time.innerHTML = `
        ${now.getFullYear()}년
        ${now.getMonth()+1}월
        ${now.getDate()}일
        ${days[now.getDay()]}
        <br>
        ${now.toLocaleTimeString()}
    `;
}

updateTime();
setInterval(updateTime,1000);


// ========================================
// 2. Firebase 설정

const pullKey = "8a7jul1r3kg4hd63";

firebase.initializeApp({
    apiKey: "AIzaSyC4L8ICZbJDufxe8bimRdB5cAulPCaYVQQ",
    databaseURL: "https://rtirl-a1d7f-default-rtdb.firebaseio.com",
    projectId: "rtirl-a1d7f",
    appId: "1:684852107701:web:d77a8ed0ee5095279a61fc"
});

const firebaseRef = firebase.database()
    .ref()
    .child("pullables")
    .child(pullKey);


// ========================================
// 3. 화면 요소

const address = document.getElementById("address");
const tempText = document.getElementById("temp");
const distanceText = document.getElementById("distance");


// ========================================
// 4. 지도 생성

const map = L.map('map', {
    zoomControl:false
}).setView([37.5665,126.9780],14);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19}
).addTo(map);


// ========================================
// 5. 현재 위치 마커

const marker = L.marker(
    [37.5665,126.9780],
    {
        icon:L.divIcon({
            className:'',
            html:`
                <div class="pulse-marker">
                    <div class="pulse"></div>
                    <div class="dot"></div>
                </div>
            `,
            iconSize:[20,20],
            iconAnchor:[10,10]
        })
    }
).addTo(map);

marker.setZIndexOffset(1000);


// ========================================
// 6. 이동 경로 점 표시
// 선은 사용하지 않음

const SAMPLE_INTERVAL = 60 * 1000;

const dotMarkers = [];
const dotLatLngs = [];

let lastDotAt = 0;
let lastDot = null;
let forceNextDot = true;


// ========================================
// 7. 자동 지도 화면 전환

let viewMode = 0;

setInterval(() => {

    if(document.hidden) return;

    viewMode++;

    if(viewMode > 2) viewMode = 0;

    if(viewMode === 0){

        map.flyTo(
            marker.getLatLng(),
            14,
            {animate:true,duration:2}
        );

    }
    else if(viewMode === 1){

        if(dotLatLngs.length > 1){

            map.fitBounds(
                L.latLngBounds(dotLatLngs),
                {
                    padding:[30,30],
                    maxZoom:14
                }
            );
        }

    }
    else if(viewMode === 2){

        map.flyTo(
            marker.getLatLng(),
            9,
            {animate:true,duration:2}
        );

    }

},60000);


// ========================================
// 8. 거리 계산

let totalDistance = 0;
let prevLatLng = null;

function calculateDistance(lat1,lng1,lat2,lng2){

    const R = 6371;

    const dLat = (lat2-lat1)*Math.PI/180;
    const dLng = (lng2-lng1)*Math.PI/180;

    const a =
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLng/2)**2;

    const c = 2*Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return R*c;
}


// ========================================
// 9. 위치 점 추가

function addLocationDot(lat,lng){

    const now = Date.now();

    // 같은 위치의 중복 점 방지
    if(
        lastDot &&
        now-lastDotAt < 10000 &&
        calculateDistance(
            lastDot.lat,lastDot.lng,lat,lng
        ) < 0.005
    ){
        return;
    }

    const point = L.circleMarker(
        [lat,lng],
        {
            radius:4,
            color:'#ffffff',
            weight:1.5,
            fillColor:'#0066FF',
            fillOpacity:1
        }
    ).addTo(map);

    dotMarkers.push(point);
    dotLatLngs.push([lat,lng]);

    lastDot = {lat,lng};
    lastDotAt = now;

    // 최근 8000개 점 유지
    if(dotMarkers.length > 8000){

        const old = dotMarkers.shift();

        map.removeLayer(old);
        dotLatLngs.shift();
    }

}


// ========================================
// 10. 카카오 주소 및 날씨

function getKakaoAddress(geocoder,lat,lng){

    return new Promise(resolve=>{

        geocoder.coord2Address(
            lng,lat,
            function(result,status){

                if(
                    status === kakao.maps.services.Status.OK &&
                    result[0]
                ){

                    const addr = result[0].address;

                    resolve(
                        `${addr.region_1depth_name || ''} `+
                        `${addr.region_2depth_name || ''} `+
                        `${addr.region_3depth_name || ''}`
                    .trim());

                }else{

                    resolve('주소 정보 없음');

                }
            }
        );
    });
}

async function updateAddress(lat,lng){

    try{

        const geocoder =
            new kakao.maps.services.Geocoder();

        const fullAddress =
            await getKakaoAddress(geocoder,lat,lng);

        address.innerHTML = fullAddress;

        const weatherRes = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m`
        );

        const weatherData = await weatherRes.json();

        const temp = weatherData.current.temperature_2m;

        tempText.innerHTML = `${temp}°C`;

    }catch(e){

        console.error("주소/날씨 오류:",e);

        address.innerHTML = '주소 확인 실패';

    }
}


// ========================================
// 11. 위치 데이터 처리

function processLocation(location,forceDot=false){

    if(document.hidden){

        prevLatLng = null;
        return;
    }

    if(
        !location ||
        location.latitude == null ||
        location.longitude == null
    ) return;

    const lat = Number(location.latitude);
    const lng = Number(location.longitude);

    if(!Number.isFinite(lat) || !Number.isFinite(lng)) return;

    // 현재 위치 마커 이동
    marker.setLatLng([lat,lng]);

    // 현재 위치 따라가기
    if(viewMode !== 1){

        map.panTo(
            [lat,lng],
            {animate:true}
        );

    }

    // 1분 간격으로 점 추가
    const now = Date.now();

    if(
        forceDot ||
        forceNextDot ||
        now-lastDotAt >= SAMPLE_INTERVAL
    ){

        addLocationDot(lat,lng);

        forceNextDot = false;
    }

    // 주행거리 계산
    // 백그라운드 복귀 후 첫 위치는 계산하지 않음
    if(prevLatLng){

        const dist = calculateDistance(
            prevLatLng.lat,
            prevLatLng.lng,
            lat,
            lng
        );

        totalDistance += dist;
    }

    prevLatLng = {lat,lng};

    distanceText.innerHTML =
        `<span id="temp">${tempText.innerHTML}</span>`+
        `&nbsp;&nbsp;${totalDistance.toFixed(2)} km`;

    updateAddress(lat,lng);
}


// ========================================
// 12. PRISM 백그라운드 감지

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            // 화면 전체 투명
            document.body.classList.add("background-mode");

            // 다음 복귀 위치는 새 구간으로 시작
            prevLatLng = null;
            forceNextDot = true;

            console.log("백그라운드: 화면 숨김");

        }else{

            // 화면 다시 표시
            document.body.classList.remove("background-mode");

            // 지도 크기 재계산
            map.invalidateSize();

            // 이전 위치와 연결하지 않음
            prevLatLng = null;
            forceNextDot = true;

            // Firebase 최신 좌표 다시 요청
            firebaseRef.once("value")
                .then(snapshot=>{

                    const data = snapshot.val();

                    if(!data) return;

                    const location = data.location || data;

                    processLocation(location,true);

                })
                .catch(error=>{

                    console.error("복귀 위치 조회 실패:",error);

                });

            updateTime();

            console.log("활성화: 지도 다시 표시");

        }

    }
);


// ========================================
// 13. RTIRL 실시간 GPS 수신

firebaseRef.on(
    "value",
    function(snapshot){

        const data = snapshot.val();

        if(!data) return;

        const location = data.location || data;

        processLocation(location);

    },
    function(error){

        console.error("Firebase 연결 오류:",error);

    }
);

console.log("RTIRL 위치 수신 대기 중");

</script>
</body>
</html>
